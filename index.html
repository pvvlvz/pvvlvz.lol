<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pvvlvz</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas, .mtn { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .mtn { fill: #000; stroke: #fff; stroke-width: 1; }
  header { position: relative; z-index: 1; display: flex; justify-content: flex-end; align-items: center; height: 56px; padding: 0 24px; background: #121212; border-bottom: 1px solid #262626; }
  header a { color: #fff; opacity: .7; transition: opacity .2s; display: flex; }
  header a:hover, header a:focus-visible { opacity: 1; }
</style>
</head>
<body>
<header>
  <a href="https://github.com/pvvlvz" aria-label="GitHub">
    <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
</header>
<svg class="mtn" aria-hidden="true"></svg>
<canvas id="snow"></canvas>
<script>
  // Mountains: seeded midpoint-displacement ridgelines, rebuilt at screen size so they never get cropped.
  // segs (a power of 2) sets how many peaks/valleys; rough sets how jagged the detail between them is
  function ridge(seed, segs, rough, n = 128) {
    const rand = () => (seed = seed * 16807 % 2147483647) / 2147483647;
    const a = new Array(n + 1), seg = n / segs;
    for (let i = 0; i <= n; i += seg) a[i] = (i / seg) % 2 ? .6 + .4 * rand() : .4 * rand();
    for (let step = seg, amp = .5; step > 1; step /= 2, amp *= rough)
      for (let i = step / 2; i < n; i += step)
        a[i] = (a[i - step / 2] + a[i + step / 2]) / 2 + (rand() - .5) * amp;
    const lo = Math.min(...a), hi = Math.max(...a);
    return a.map(v => (v - lo) / (hi - lo));
  }
  // back to front: [seed, segs, roughness, height as a fraction of screen height (x and noise are 0..1), line opacity, echo lines]
  const layers = [
    [7, 8, .6, (x, v) => .18 + .37 * v, .25, 0],
    [42, 8, .5, (x, v) => .1 + .18 * v, .5, 0],
    [3, 4, .5, (x, v) => .05 + .5 * (1 - x) ** 2.5 + .05 * v, 1, 2], // steep left slope, after Hiroshige's Night Snow at Kambara
  ].map(([seed, segs, rough, f, o, echoes]) => ({ r: ridge(seed, segs, rough), f, o, echoes }));
  const mtn = document.querySelector('.mtn');
  function drawMountains() {
    const w = innerWidth, h = innerHeight, span = Math.max(w, h * 1.6); // tall screens show the left part of the range
    let out = '';
    for (const { r, f, o, echoes } of layers) {
      const n = r.length - 1;
      // ends sit 2px off-screen so only the ridgeline gets a visible stroke
      const d = 'M-2 ' + (h + 2) + r.map((v, i) => ` L${(i / n * (span + 4) - 2).toFixed(1)} ${(h - f(i / n, v) * h).toFixed(1)}`).join('') + ` L${span + 2} ${h + 2}Z`;
      out += `<path stroke-opacity="${o}" d="${d}"/>`;
      for (let e = 1; e <= echoes; e++) out += `<path fill="none" stroke-opacity="${o * (.4 / e)}" transform="translate(0 ${e * 10})" d="${d}"/>`;
    }
    mtn.innerHTML = out;
  }

  const c = document.getElementById('snow'), x = c.getContext('2d');
  let w, h, flakes;
  function resize() {
    w = c.width = innerWidth; h = c.height = innerHeight;
    flakes = Array.from({ length: Math.round(w * h / 8000) }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.8 + 0.4, s: Math.random() * 0.8 + 0.3, d: Math.random() * Math.PI * 2
    }));
  }
  function draw() {
    x.clearRect(0, 0, w, h);
    x.fillStyle = '#fff';
    x.beginPath();
    for (const f of flakes) {
      f.y += f.s; f.d += 0.01; f.x += Math.sin(f.d) * 0.3;
      if (f.y > h) { f.y = -2; f.x = Math.random() * w; }
      x.moveTo(f.x, f.y); x.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    }
    x.fill();
    if (!still) requestAnimationFrame(draw);
  }
  // reduced motion: show a static snowfall frame instead of animating
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('resize', () => { resize(); drawMountains(); if (still) draw(); });
  resize(); drawMountains(); draw();
</script>
</body>
</html>
